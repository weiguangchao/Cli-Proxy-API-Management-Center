name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Publish one run at a time; a newer pending run replaces an older pending one.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # Single rolling release: every main commit replaces its management.html asset.
  RELEASE_TAG: latest

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bump the patch of the previously published version (0.1.x); package.json owns major.minor.
      - name: Set build version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! notes="$(gh release view "${RELEASE_TAG}" --json body -q .body 2>gh-error.log)"; then
            if ! grep -qi 'not found' gh-error.log; then
              cat gh-error.log >&2
              exit 1
            fi
            notes=''
          fi
          version="$(PREVIOUS_RELEASE_NOTES="${notes}" bun scripts/nextReleaseVersion.ts)"
          echo "Build version: ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Verify and build all-in-one HTML
        run: bun run verify

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          {
            echo "Rolling build of \`management.html\` from \`main\`."
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            git log -1 --pretty=format:"- Message: %s"
            echo
          } > release-notes.md

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Never roll the release back to an older commit (e.g. a re-run of an old workflow).
          main_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${main_head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::main moved to ${main_head}; skipping publish for ${GITHUB_SHA}"
            exit 0
          fi

          title="management.html (${VERSION})"
          git push --force origin "${GITHUB_SHA}:refs/tags/${RELEASE_TAG}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/management.html --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "${RELEASE_TAG}" dist/management.html \
              --title "${title}" \
              --notes-file release-notes.md \
              --latest
          fi
